name: Bug Report
about: File a bug report
title: '[Bug]: '
ref: 'master'
labels:
  - 'class/bug'
  - 'status/new'
body:
  - type: textarea
    id: version-info
    attributes:
      label: What is the problem environment ?
      description: Please provide the OS details, output of `exim -d -bV 2>/dev/null` and as much information as you think is relevant.
      placeholder: Operating system and version, Exim version
      value: ''
      render: shell
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: 'A bug happened!'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
